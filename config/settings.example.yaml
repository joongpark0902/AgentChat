# 배포용 예시입니다. 처음 실행하면 settings.yaml 로 복사됩니다(개인 설정, git 제외).
# python_dir 을 비워 두면 서버를 실행한 python 의 폴더를 씁니다.
host: 127.0.0.1
port: 8780
max_rounds: 3
call_timeout_sec: 1800
workspace_root: workspace
log_dir: logs
python_dir: ''
claude:
  exe: claude
  safe_mode: false
codex:
  exe: auto
  sandbox: workspace-write
  windows_sandbox: unelevated
stt:
  engine: local
  model: small
  vocabulary:
  - 손익
  - 영업이익
  - 매출
  - 원가
  - 판관비
  - 재무제표
  - 감사조서
  - 주석
  - 엑셀
  - 풋팅
# 메일 요약 예약(클래식 Outlook 이 있는 PC 에서만). 켜면 그 시각마다 실무자가 새로 받은 메일을 읽고 요약해 폰 알림을 보냅니다.
# 이 PC·이 서버·Outlook 이 켜져 있어야 하고, 그 시각에 꺼져 있거나 잠들어 있었으면 켜진 뒤 5분쯤 지나 한 번 돕니다.
# times 에 하루 여러 시각을 적을 수 있습니다(예: 아침에 켤 때 받으려면 이른 시각 하나 + '14:00' + '17:30'). 따옴표를 붙여 적습니다.
# 같은 날의 요약은 그날 대화 하나에 이어서 쌓입니다. 켜 두면 도는 횟수만큼 사용량을 씁니다.
mail_digest:
  enabled: false
  times:
  - '10:00'
  weekdays_only: false   # true 면 토·일은 건너뜀(월요일에 주말 메일까지 요약)
  notify_empty: true     # 새 메일이 없는 날에도 '새 메일 없음' 알림
